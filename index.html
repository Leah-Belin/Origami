<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fold Along — Waterbomb Base</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --bg:#EAE7DD;
  --surface:#FFFFFF;
  --surface-2:#F2EFE6;
  --ink:#20242A;
  --ink-muted:#5B6169;
  --border:#D7D2C4;
  --mat:#DAD5C7;
  --accent-valley:#C1442D;
  --accent-valley-soft:#F4DED7;
  --accent-mountain:#2B6E77;
  --accent-mountain-soft:#DCE9E8;
  --paper-front:#C1442D;
  --paper-back:#F2EEE3;
  --shadow: rgba(32,28,22,.20);
  --focus:#2B6E77;
  /* Dedicated badge-text colors, tuned per-mode for ~4.5:1+ contrast
     against their own badge background (see .badge.valley/.badge.collapse
     below) — kept separate from --accent-valley/--accent-mountain so this
     contrast fix can't ripple into the other UI that reuses those tokens
     (nav link, primary button, step chip). */
  --badge-valley-fg:#A23821;
  --badge-collapse-fg:#2B6E77;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1D22; --surface:#23262D; --surface-2:#2A2D35;
    --ink:#ECE9E2; --ink-muted:#9CA3AC; --border:#3A3E47; --mat:#2A2D34;
    --accent-valley-soft:#3B2622; --accent-mountain-soft:#1D3033;
    --shadow: rgba(0,0,0,.55);
    --badge-valley-fg:#E8836B; --badge-collapse-fg:#4FB0BA;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1D22; --surface:#23262D; --surface-2:#2A2D35;
  --ink:#ECE9E2; --ink-muted:#9CA3AC; --border:#3A3E47; --mat:#2A2D34;
  --accent-valley-soft:#3B2622; --accent-mountain-soft:#1D3033;
  --shadow: rgba(0,0,0,.55);
  --badge-valley-fg:#E8836B; --badge-collapse-fg:#4FB0BA;
}

*{box-sizing:border-box;}
body{ margin:0; background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans', system-ui, sans-serif; -webkit-font-smoothing:antialiased; }

.site-bar{ border-bottom:1px solid var(--border); }
.site-bar-inner{ max-width:1080px; margin:0 auto; padding:1.1rem 1.5rem; display:flex; align-items:baseline; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
.site-title{ font-family:'Unbounded', sans-serif; font-weight:700; font-size:1rem; color:var(--ink); text-decoration:none; }
.site-tagline{ font-family:'IBM Plex Mono', monospace; font-size:.72rem; letter-spacing:.06em; color:var(--ink-muted); }
.site-nav{ display:flex; gap:.8rem; }
/* Padding + matching negative margin grows the tap target to ~44px tall
   without shifting the link's visual position or the bar's height. */
.site-nav a{ font-family:'IBM Plex Mono', monospace; font-size:.78rem; letter-spacing:.04em; color:var(--ink-muted); text-decoration:none; display:inline-block; padding:.85rem .3rem; margin:-.85rem -.3rem; border-radius:6px; }
.site-nav a:hover{ color:var(--ink); }
.site-nav a.current{ color:var(--accent-mountain); }

.wrap{ max-width:1080px; margin:0 auto; padding:2.5rem 1.5rem 4rem; }
header{ margin-bottom:2rem; }
h1{ font-family:'Unbounded', sans-serif; font-weight:700; font-size:clamp(1.7rem, 3.4vw, 2.35rem); line-height:1.12; margin:0; text-wrap:balance; }

.board{ display:grid; grid-template-columns: minmax(320px, 480px) 1fr; gap:1.75rem; align-items:start; }
/* Width-only check misses short/landscape phones (e.g. 812x375 — wider
   than 780 but too short for a desktop 2-col layout plus a square stage),
   so a height+orientation clause is OR'd in alongside the width check. */
@media (max-width: 780px), (max-height: 500px) and (orientation: landscape){
  .board{ grid-template-columns: 1fr; }
}
@media (max-height: 500px) and (orientation: landscape){
  .wrap{ padding:1.2rem 1.2rem 2rem; }
  header{ margin-bottom:1rem; }
}

.stage-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:1.25rem; box-shadow: 0 1px 2px var(--shadow); }
.stage-outer{ position:relative; aspect-ratio:1/1; border-radius:8px; background:var(--mat); overflow:hidden; cursor:grab; touch-action:none; }
.stage-outer.grabbing{ cursor:grabbing; }
.stage-outer:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
.stage-outer canvas{ display:block; width:100%; height:100%; }
/* Placed after the base .stage-outer rule above so this wins the cascade
   (equal specificity — source order decides) whenever the media query
   matches: a square aspect-ratio would otherwise make the stage as tall as
   it is wide (~full viewport width), swamping a short viewport. The WebGL
   resize() loop already reads clientWidth/clientHeight generically, so
   capping height here and letting width follow needs no JS change. */
@media (max-height: 500px) and (orientation: landscape){
  .stage-outer{ aspect-ratio:auto; height:34vh; }
}
/* Discoverability affordance for the drag-to-rotate interaction: cursor:grab
   above signals it on desktop hover, but there's no hover on touch, so this
   small textual hint carries the same message there. Visible until the
   user's first real drag, then fades out (see hideDragHint() in the script). */
.drag-hint{ position:absolute; left:50%; bottom:.7rem; transform:translateX(-50%); display:flex; align-items:center; gap:.35rem; background:rgba(20,18,14,.62); color:#fff; font-family:'IBM Plex Mono', monospace; font-size:.68rem; letter-spacing:.03em; padding:.4rem .75rem; border-radius:99px; pointer-events:none; opacity:1; transition:opacity .5s ease; white-space:nowrap; }
.drag-hint.is-hidden{ opacity:0; }
.stage-caption{ margin-top:.85rem; font-family:'IBM Plex Mono', monospace; font-size:.74rem; color:var(--ink-muted); text-align:center; }

.panel{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:1.5rem 1.6rem 1.7rem; box-shadow: 0 1px 2px var(--shadow); }
.panel-top{ display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1.1rem; }
.step-count{ font-family:'IBM Plex Mono', monospace; font-size:.78rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-muted); }
.badge{ font-family:'IBM Plex Mono', monospace; font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; padding:.3rem .6rem; border-radius:99px; white-space:nowrap; }
.badge.valley{ background:var(--accent-valley-soft); color:var(--badge-valley-fg); }
.badge.collapse{ background:var(--accent-mountain-soft); color:var(--badge-collapse-fg); }
.badge.done{ background:var(--surface-2); color:var(--ink-muted); }

.instruction{ font-family:'Unbounded', sans-serif; font-weight:600; font-size:1.22rem; line-height:1.35; margin:0 0 1.3rem; text-wrap:balance; min-height:3.6rem; }

.controls{ display:flex; gap:.6rem; margin-bottom:1.1rem; flex-wrap:wrap; }
button{ font-family:'IBM Plex Sans', sans-serif; font-size:.88rem; font-weight:500; padding:.85rem 1.05rem; min-height:44px; border-radius:9px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink); cursor:pointer; touch-action:manipulation; transition: background .15s ease, transform .1s ease, opacity .15s ease; }
button:hover:not(:disabled):not([aria-disabled="true"]){ background:var(--border); }
button:active:not(:disabled):not([aria-disabled="true"]){ transform: scale(.97); }
/* aria-disabled + pointer-events:none (not the native disabled attribute)
   so Fold/Play stay focusable and keyboard users don't lose their place
   mid-animation — disabled elements can't hold focus, aria-disabled ones can. */
button:disabled, button[aria-disabled="true"]{ opacity:.4; cursor:default; pointer-events:none; }
button:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
button.primary{ background:var(--accent-mountain); border-color:var(--accent-mountain); color:#fff; }
button.primary:hover:not(:disabled){ background:#255e66; }

/* Step navigation: one short-labeled chip per step, not the old unlabeled
   dots — wraps like the paper-color swatches below it. min-height:36px
   overrides the generic button{min-height:44px} rule (class beats type
   selector) so chips stay compact enough to wrap sensibly across a few
   rows. */
.steps-nav{ display:flex; gap:.5rem; flex-wrap:wrap; }
.step-chip{ font-family:'IBM Plex Sans', sans-serif; font-size:.76rem; font-weight:500; padding:.5rem .75rem; min-height:36px; border-radius:99px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink-muted); cursor:pointer; white-space:nowrap; }
/* Matches the generic button:hover selector's specificity exactly (same
   type + pseudo-class chain) so source order — this rule comes later in
   the file — is what decides the tie, rather than losing to it outright. */
.step-chip:hover:not(:disabled):not([aria-disabled="true"]){ background:var(--border); color:var(--ink); }
.step-chip.done{ background:var(--accent-mountain-soft); color:var(--ink); border-color:transparent; }
.step-chip.current{ background:var(--accent-mountain); color:#fff; border-color:var(--accent-mountain); }
.step-chip.current:hover:not(:disabled):not([aria-disabled="true"]){ background:var(--accent-mountain); color:#fff; }

.swatch-label{ font-family:'IBM Plex Mono', monospace; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-muted); margin:1.3rem 0 .7rem; }
/* gap widened from .55rem so the ::after hit-area expansion below (8px a
   side, 16px between two adjacent swatches) doesn't overlap into the
   neighboring swatch's own hit area. */
.swatches{ display:flex; gap:1rem; flex-wrap:wrap; }
/* min-height:28px overrides the generic button{min-height:44px} rule
   (higher specificity wins), which otherwise stretched this to 28x44 —
   an oval, not a circle. The 44px touch target isn't lost: ::after below
   pads the actual hit area back out to ~44x44 invisibly, around the
   visible 28px dot. */
.swatch{ width:28px; height:28px; min-height:28px; padding:0; border-radius:50%; border:2px solid transparent; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12); cursor:pointer; position:relative; }
.swatch::after{ content:''; position:absolute; inset:-8px; }
.swatch:hover{ transform:scale(1.08); }
.swatch.active{ border-color:var(--ink); }
.swatch:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
</style>
</head>
<body>

<div class="site-bar">
  <div class="site-bar-inner">
    <span class="site-title">Fold Along</span>
    <nav class="site-nav">
      <a href="index.html" class="current" aria-current="page">Waterbomb base</a>
      <a href="flower.html">Flower base</a>
    </nav>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<div class="wrap">
  <header>
    <h1>Waterbomb base</h1>
  </header>

  <main>
    <div class="board">
      <div class="stage-card">
        <div class="stage-outer" id="stage" tabindex="0" role="application" aria-label="3D model of the waterbomb base fold, draggable to rotate — use arrow keys when focused to rotate.">
          <div class="drag-hint" id="dragHint" aria-hidden="true">↻ Drag to rotate</div>
        </div>
        <p class="stage-caption" id="stageCaption">square sheet, flat</p>
      </div>
      <div class="panel">
        <div class="panel-top">
          <span class="step-count" id="stepCount">Step 1 of 11</span>
          <span class="badge valley" id="badge">Fold</span>
        </div>
        <p class="instruction" id="instruction" aria-live="polite" aria-atomic="true"></p>
        <div class="controls">
          <button id="foldBtn" class="primary">Fold →</button>
          <button id="playBtn">▶ Play all</button>
        </div>
        <p class="swatch-label">Jump to a step</p>
        <div class="steps-nav" id="stepsNav"></div>
        <p class="swatch-label">Paper color</p>
        <div class="swatches" id="swatches"></div>
      </div>
    </div>
  </main>
</div>

<script>
(function(){
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- Geometry: 9 named points (center + 4 corners + 4 edge-midpoints) ----
  const OUTER = ['A','N','B','E','C','S','D','W'];

  // Flat starting positions (Y=0 plane). X,Z mirror the original 2D square (0-100),
  // recentered so the middle (Ctr) sits at the origin.
  const FLAT = {
    Ctr: new THREE.Vector3(0,0,0),
    A: new THREE.Vector3(-50,0,-50),
    B: new THREE.Vector3(50,0,-50),
    C: new THREE.Vector3(50,0,50),
    D: new THREE.Vector3(-50,0,50),
    N: new THREE.Vector3(0,0,-50),
    E: new THREE.Vector3(50,0,0),
    S: new THREE.Vector3(0,0,50),
    W: new THREE.Vector3(-50,0,0),
  };

  // The real sequence turns the paper over between the horizontal/vertical
  // creases and the diagonal ones — that's what lets every crease be an
  // easy valley fold (toward whoever's folding) instead of forcing two of
  // the four to be the harder-to-see mountain kind. FLIPPED_FLAT is the
  // flat sheet after that turn-over: a 180° rotation about the vertical
  // (N-S) crease, i.e. every point's X mirrored, Y and Z unchanged. The
  // diagonal-fold steps and the collapse both start from here, not FLAT.
  const FLIPPED_FLAT = {};
  Object.keys(FLAT).forEach(name=>{
    const p = FLAT[name];
    FLIPPED_FLAT[name] = new THREE.Vector3(-p.x, p.y, p.z);
  });

  // 8 triangular faces, Ctr + consecutive outer points around the ring.
  // Non-indexed (each triangle gets its own 3 vertex slots, none shared) so
  // each panel can carry its own front/back color without fighting its
  // neighbors over a shared vertex.
  const PANELS = [];
  for(let i=0;i<OUTER.length;i++){
    PANELS.push(['Ctr', OUTER[(i+1)%OUTER.length], OUTER[i]]);
  }
  const RED = [0.757,0.267,0.176], WHITE = [0.949,0.933,0.890];

  // Ring edges for the outline overlay: 8 spokes (Ctr-outer) + 8 rim segments.
  const LINE_PAIRS = [];
  OUTER.forEach(n=>LINE_PAIRS.push('Ctr',n));
  for(let i=0;i<OUTER.length;i++) LINE_PAIRS.push(OUTER[i], OUTER[(i+1)%OUTER.length]);

  function rotateAroundAxisAtOrigin(v, axisDir, angleRad){
    const axis = axisDir.clone().normalize();
    const cosA = Math.cos(angleRad), sinA = Math.sin(angleRad);
    const term1 = v.clone().multiplyScalar(cosA);
    const term2 = new THREE.Vector3().crossVectors(axis, v).multiplyScalar(sinA);
    const term3 = axis.clone().multiplyScalar(axis.dot(v) * (1 - cosA));
    return term1.add(term2).add(term3);
  }

  // Cache a consistently-signed rotation axis per fold step, so every flap
  // swings toward +Y (up, over the rest of the sheet) regardless of which
  // order the two crease points happen to be listed in. Reads from the
  // step's own reference flat state (step.ref) — FLAT for steps before the
  // turn-over, FLIPPED_FLAT for the diagonal folds after it — since crease
  // endpoints are diameters through the center in either state, so reading
  // from the right one is safe.
  function axisForStep(step){
    if(step._axis) return step._axis;
    const ref = step.ref || FLAT;
    const a = ref[step.crease[0]], b = ref[step.crease[1]];
    const axisDir = new THREE.Vector3().subVectors(b, a);
    const probe = rotateAroundAxisAtOrigin(ref[step.moving[0]], axisDir, 0.05);
    if(probe.y < ref[step.moving[0]].y){ axisDir.negate(); }
    step._axis = axisDir;
    return axisDir;
  }

  // The real collapse can't be built from a chain of ordinary single-hinge
  // folds — that was tried and it's mathematically wrong: any sequence of
  // whole-flap 180° hinge folds along these creases drags the 4 edge
  // midpoints (N,E,S,W) together into a single point too, when the real
  // base needs them to stay apart, spread around the rim. The actual
  // mechanism is a single coordinated motion (the vertical/horizontal
  // creases and the diagonals moving in opposite senses at once), so it's
  // modeled here as one target 3D pose, derived from the one constraint
  // that has to hold throughout: every panel is a rigid triangle, so the
  // three original side lengths (center-to-corner, center-to-edge-midpoint,
  // and each rim edge) must still measure the same once collapsed.
  // Solving that gives center and the 4-corners meeting point sitting a
  // distance h = 25*sqrt(2) apart on the y-axis, with N/E/S/W staying in
  // the original z=0 plane at the same height, just pulled in from radius
  // 50 to 25*sqrt(2) — but the constraint alone doesn't say which of the
  // two ends the corners land on: the solve is symmetric under swapping
  // "center up / corners down" for "center down / corners up". Confirmed
  // against real folded paper: the corners rise to meet ABOVE center,
  // while center dips down as the opposite tip.
  // The collapse itself starts from plain FLAT: real instructions turn the
  // paper over a SECOND time after the diagonal creases (see the STEPS
  // array below) to put it back in its starting orientation before the
  // collapse — that's the orientation the "corners up" motion above
  // assumes, so no mirroring is needed here despite the turn-overs
  // in between.
  const K = 25 * Math.SQRT2;
  const CORNER_PT = new THREE.Vector3(0, K, 0);
  const COLLAPSED = {
    Ctr: new THREE.Vector3(0, -K, 0),
    A: CORNER_PT, B: CORNER_PT, C: CORNER_PT, D: CORNER_PT,
    N: new THREE.Vector3(0, 0, -K),
    E: new THREE.Vector3(K, 0, 0),
    S: new THREE.Vector3(0, 0, K),
    W: new THREE.Vector3(-K, 0, 0),
  };

  // ---- Steps ----
  const STEPS = [
    { type:'fold', crease:['W','E'], moving:['N','A','B'], label:'Fold top down', instruction:'Fold the top down to the bottom, creating a horizontal center crease.' },
    { type:'unfold', label:'Unfold', instruction:'Unfold.' },
    { type:'fold', crease:['N','S'], moving:['E','B','C'], label:'Fold right side', instruction:'Fold the right side to the left side, creating a vertical center crease.' },
    { type:'unfold', label:'Unfold', instruction:'Unfold.' },
    { type:'flip', from:FLAT, label:'Flip over', instruction:'Turn the paper over — this lets both diagonal creases fold the same easy way as the last two.' },
    { type:'fold', crease:['A','C'], moving:['B','N','E'], ref:FLIPPED_FLAT, label:'Fold top-left', instruction:'Fold the top-left corner to the bottom-right corner, creating a diagonal crease.' },
    { type:'unfold', label:'Unfold', instruction:'Unfold.' },
    { type:'fold', crease:['B','D'], moving:['A','N','W'], ref:FLIPPED_FLAT, label:'Fold top-right', instruction:'Fold the top-right corner to the bottom-left corner, creating the other diagonal crease.' },
    { type:'unfold', label:'Unfold', instruction:'Unfold. All 4 creases exist now — this is the hard part next.' },
    { type:'flip', from:FLIPPED_FLAT, label:'Flip back', instruction:'Turn the paper back over, the same way as before — it needs to be back in its starting orientation for the collapse.' },
    { type:'collapse', label:'Collapse base', instruction:'Now fold on the vertical and horizontal creases while the diagonals push through the other way — the whole sheet collapses at once. All 4 corners meet at one point above center; center dips down as the opposite tip; the 4 edge midpoints stay apart, forming the base\'s rim.' },
  ];

  // ---- Three.js scene ----
  const stageEl = document.getElementById('stage');
  const scene = new THREE.Scene();
  // Near/far kept tight around where the geometry actually lives (roughly
  // 50-450 units from camera) — the depth buffer only has so much
  // precision, and wasting most of it on 0.1-1000 was the cause of visible
  // z-fighting flicker while two panels pass through nearly-coplanar
  // poses mid-fold.
  //
  // Framing: every named point stays within ~71 units of the origin for
  // the whole sequence (flat sheet, mid-folds, and the collapsed base
  // alike — checked numerically), but a flat, nearly-overhead pose reads
  // as a thin sliver rather than a shape with volume. A closer camera and
  // wider FOV than before make that sliver (and every other step) fill
  // much more of the stage, and centering the look-at on the origin
  // (rather than well below it) keeps both the flat poses and the
  // collapsed base framed well without clipping either extreme.
  const camera = new THREE.PerspectiveCamera(46, 1, 50, 500);
  camera.position.set(100, 55, 115);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  stageEl.appendChild(renderer.domElement);

  const group = new THREE.Group();
  scene.add(group);

  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const dir1 = new THREE.DirectionalLight(0xffffff, 0.7); dir1.position.set(100,150,100); scene.add(dir1);
  const dir2 = new THREE.DirectionalLight(0xffffff, 0.35); dir2.position.set(-100,-50,-100); scene.add(dir2);

  // Non-indexed: 8 panels x 3 vertices, none shared — lets each triangle
  // keep its own normal (and its own color) under flatShading instead of
  // averaging with neighbors at the shared Ctr vertex.
  const geometry = new THREE.BufferGeometry();
  const vertCount = PANELS.length * 3;
  const positions = new Float32Array(vertCount * 3);
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

  // The paper has a real front and a real back, always — a viewer should
  // be able to spin the flat, untouched sheet and see the front color on
  // top, white underneath, before a single fold happens. That can only
  // come from the GPU's own per-fragment "which side of this triangle am I
  // looking at" test (gl_FrontFacing): vertex colors are the same
  // regardless of which side is toward the camera, so they can't represent
  // a true two-sided sheet. Panels are wound so the front (+Y when flat)
  // is consistent everywhere, and a fold is a rotation (never a
  // reflection), so that winding — and therefore which side is "front" —
  // never changes; this just asks, per pixel, which side is currently
  // facing the camera.
  //
  // The front face (uFront) is the side that starts face-up on the flat
  // sheet; confirmed against real folded paper, that side ends up hidden
  // inside the finished base, not showing on the outside. So uFront is
  // fixed white (the paper's "wrong side"), and the customizable color
  // lives on uBack, the side that starts face-down and ends up showing.
  // uBack is a uniform (not baked into the shader source) so the color
  // swatches can change it live, without recompiling.
  const colorUniforms = { uFront: { value: new THREE.Color(...WHITE) }, uBack: { value: new THREE.Color(...RED) } };
  const paperMat = new THREE.MeshStandardMaterial({
    side: THREE.DoubleSide, roughness:0.85, metalness:0.05, flatShading:true
  });
  paperMat.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, colorUniforms);
    shader.fragmentShader = 'uniform vec3 uFront;\nuniform vec3 uBack;\n' + shader.fragmentShader.replace(
      '#include <color_fragment>',
      `#include <color_fragment>
      diffuseColor.rgb = gl_FrontFacing ? uFront : uBack;`
    );
  };
  const paperMesh = new THREE.Mesh(geometry, paperMat);
  group.add(paperMesh);

  const linePositions = new Float32Array(LINE_PAIRS.length * 3);
  const lineGeo = new THREE.BufferGeometry();
  lineGeo.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
  const lineMat = new THREE.LineBasicMaterial({ color: 0x20242A, transparent:true, opacity:0.4 });
  const lines = new THREE.LineSegments(lineGeo, lineMat);
  group.add(lines);

  function applyFrame(frame){
    let vi = 0;
    PANELS.forEach(tri=>{
      tri.forEach(name=>{
        const p = frame[name] || FLAT[name];
        positions[vi*3]=p.x; positions[vi*3+1]=p.y; positions[vi*3+2]=p.z;
        vi++;
      });
    });
    geometry.attributes.position.needsUpdate = true;
    geometry.computeVertexNormals();

    LINE_PAIRS.forEach((name,i)=>{
      const p = frame[name] || FLAT[name];
      linePositions[i*3]=p.x; linePositions[i*3+1]=p.y; linePositions[i*3+2]=p.z;
    });
    lineGeo.attributes.position.needsUpdate = true;
  }

  applyFrame(FLAT);

  function resize(){
    const w = stageEl.clientWidth, h = stageEl.clientHeight;
    if(!w || !h) return;
    renderer.setSize(w, h, false);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stageEl);
  resize();

  // Gentle auto-rotate until the user first drags, then it's fully in
  // their hands — dragging (mouse or touch, via Pointer Events so both
  // are handled the same way) spins the model around Y and tilts it
  // around X. Free, unclamped tilt on purpose: the paper has a real front
  // and back, and the only way to see the back is to actually turn it
  // over — an artificial limit here would make that impossible.
  //
  // userRotating only flips on once real movement is seen (past
  // DRAG_THRESHOLD px), not on pointerdown alone — a tap with no movement
  // (e.g. someone just testing the stage, or a mis-tap) used to freeze the
  // ambient sway forever for no benefit.
  const DRAG_THRESHOLD = 4;
  let autoRotate = 0, userRotating = false, pointerActive = false, dragging = false;
  let downX = 0, downY = 0, lastX = 0, lastY = 0;

  const dragHintEl = document.getElementById('dragHint');
  function hideDragHint(){ dragHintEl.classList.add('is-hidden'); }

  stageEl.addEventListener('pointerdown', (e)=>{
    pointerActive = true;
    dragging = false;
    downX = lastX = e.clientX; downY = lastY = e.clientY;
    stageEl.setPointerCapture(e.pointerId);
  });
  stageEl.addEventListener('pointermove', (e)=>{
    if(!pointerActive) return;
    if(!dragging){
      const totalDx = e.clientX - downX, totalDy = e.clientY - downY;
      if(Math.hypot(totalDx, totalDy) < DRAG_THRESHOLD) return;
      // Threshold just crossed: this is a real drag, not a stray tap.
      dragging = true;
      userRotating = true;
      stageEl.classList.add('grabbing');
      hideDragHint();
      lastX = e.clientX; lastY = e.clientY;
      return;
    }
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    group.rotation.y += dx * 0.008;
    group.rotation.x += dy * 0.008;
  });
  function endDrag(){ pointerActive = false; dragging = false; stageEl.classList.remove('grabbing'); }
  stageEl.addEventListener('pointerup', endDrag);
  stageEl.addEventListener('pointercancel', endDrag);
  stageEl.addEventListener('pointerleave', endDrag);

  // Keyboard equivalent of the drag-to-rotate gesture above: arrow keys
  // rotate the model in the same two axes, by a fixed increment per press.
  // Treated exactly like a real drag once used (userRotating=true, hide the
  // drag hint) so keyboard users get the same "you're driving now" handoff
  // from the ambient sway.
  const KEY_ROTATE_STEP = 0.12;
  stageEl.addEventListener('keydown', (e)=>{
    let dy = 0, dx = 0;
    if(e.key==='ArrowLeft') dy = -KEY_ROTATE_STEP;
    else if(e.key==='ArrowRight') dy = KEY_ROTATE_STEP;
    else if(e.key==='ArrowUp') dx = -KEY_ROTATE_STEP;
    else if(e.key==='ArrowDown') dx = KEY_ROTATE_STEP;
    else return;
    e.preventDefault();
    if(!userRotating){ userRotating = true; hideDragHint(); }
    group.rotation.y += dy;
    group.rotation.x += dx;
  });

  function renderLoop(){
    if(!userRotating && !reducedMotion){
      autoRotate += 0.003;
      group.rotation.y = Math.sin(autoRotate) * 0.35;
    }
    renderer.render(scene, camera);
    requestAnimationFrame(renderLoop);
  }
  renderLoop();

  // ---- Paper color ----
  // Front color only — the back stays a consistent off-white, matching
  // how real single-color origami paper actually works. Remembered across
  // visits (and shared with the other page) via localStorage; falls back
  // silently to the default if storage isn't available.
  const PAPER_COLORS = [
    { name:'Red',    hex:'#C1442D' },
    { name:'Orange', hex:'#D97A34' },
    { name:'Yellow', hex:'#D9B23C' },
    { name:'Green',  hex:'#4C8C6B' },
    { name:'Blue',   hex:'#3B6FA0' },
    { name:'Purple', hex:'#7A5A9E' },
    { name:'Pink',   hex:'#C97B94' },
    { name:'Black',  hex:'#2B2E33' },
  ];
  const swatchesEl = document.getElementById('swatches');
  function setPaperColor(hex, save){
    colorUniforms.uBack.value.set(hex);
    swatchesEl.querySelectorAll('.swatch').forEach(b=>{
      b.classList.toggle('active', b.dataset.hex.toLowerCase()===hex.toLowerCase());
    });
    if(save){
      try{ localStorage.setItem('foldalong-paper-color', hex); }catch(e){}
    }
  }
  swatchesEl.innerHTML = PAPER_COLORS.map(c=>
    `<button class="swatch" style="background:${c.hex}" data-hex="${c.hex}" aria-label="${c.name}" title="${c.name}"></button>`
  ).join('');
  swatchesEl.querySelectorAll('.swatch').forEach(btn=>{
    btn.addEventListener('click', ()=> setPaperColor(btn.dataset.hex, true));
  });
  let savedColor = null;
  try{ savedColor = localStorage.getItem('foldalong-paper-color'); }catch(e){}
  setPaperColor(savedColor || PAPER_COLORS[0].hex, false);

  // ---- Playback state ----
  let stepIndex = 0, animating = false, playing = false;

  const el = {
    stepCount: document.getElementById('stepCount'),
    badge: document.getElementById('badge'),
    instruction: document.getElementById('instruction'),
    foldBtn: document.getElementById('foldBtn'),
    playBtn: document.getElementById('playBtn'),
    stepsNav: document.getElementById('stepsNav'),
    stageCaption: document.getElementById('stageCaption'),
  };

  function easeInOut(t){ return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }

  // Computes this step's point positions at completion-fraction p (0 = the
  // step's own starting state, 1 = fully done), independent of any running
  // animation. Used both to animate (feeding it a time-varying p) and to
  // jump straight to a step's start/end state for the step picker below,
  // without replaying every step in between.
  function frameForStep(step, p){
    if(step.type==='collapse'){
      // At the exact mathematical endpoint (p=1) every panel sits exactly
      // perpendicular to its own flat orientation — a genuine tie with no
      // well-defined "outward" side. Confirmed against real folded paper:
      // whichever side starts face-up ends up on the INSIDE of the
      // finished base, not the outside — so the tie resolves toward the
      // flipped side (uBack, the customizable color), not the starting
      // side (uFront, fixed white). Stopping just short of the exact
      // endpoint (imperceptible in shape) is what lands every panel
      // decisively on the flipped side, for this starting orientation
      // (plain FLAT — the sheet is back the right way up by the time the
      // collapse starts, per the second turn-over in the STEPS array).
      const pc = Math.min(p, 0.98);
      const out = {};
      ['Ctr', ...OUTER].forEach(name=>{
        out[name] = new THREE.Vector3().lerpVectors(FLAT[name], COLLAPSED[name], pc);
      });
      return out;
    }
    if(step.type==='flip'){
      // A rigid 180° turn of the whole sheet about the vertical (N-S)
      // crease — every point moves together, unlike a normal fold where
      // only half the sheet swings. No lift/z-fighting concerns here
      // since nothing ends up coplanar with anything else mid-turn.
      // step.from is which flat state this particular turn-over starts
      // from (FLAT for the first one, FLIPPED_FLAT for the second, which
      // turns the sheet back to plain FLAT by p=1).
      const angleRad = p * Math.PI;
      const axis = new THREE.Vector3(0, 0, 1);
      const from = step.from || FLAT;
      const out = {};
      ['Ctr', ...OUTER].forEach(name=>{
        out[name] = rotateAroundAxisAtOrigin(from[name], axis, angleRad);
      });
      return out;
    }
    const ref = step.ref || FLAT;
    const angleRad = p * Math.PI;
    // A folded flap ends up exactly coplanar with the static half
    // underneath it (folding a rectangle in half always lands one half
    // exactly on the other) — without help, the GPU's depth test resolves
    // that dead tie arbitrarily, which is why some folds correctly showed
    // the folded-over (white) side on top and others silently didn't. The
    // flap is the one that should render on top (that's what "folded
    // over" means), so lift it a hair as it approaches fully folded —
    // zero at the flat start, where there's no overlap yet to resolve.
    const lift = (angleRad / Math.PI) * 0.3;
    const axisDir = axisForStep(step);
    const out = { Ctr: ref.Ctr.clone() };
    OUTER.forEach(name=>{
      out[name] = step.moving.includes(name)
        ? rotateAroundAxisAtOrigin(ref[name], axisDir, angleRad).add(new THREE.Vector3(0, lift, 0))
        : ref[name].clone();
    });
    return out;
  }

  function animateStep(step, reverse, onDone){
    const isCollapse = step.type==='collapse';
    const duration = reducedMotion ? 1 : (isCollapse ? 1800 : 900);
    const start = performance.now();

    function frame(now){
      let t = Math.min(1, (now-start)/duration);
      const te = easeInOut(t);
      const p = reverse ? (1-te) : te;
      applyFrame(frameForStep(step, p));
      if(t<1){ requestAnimationFrame(frame); return; }
      onDone();
    }
    requestAnimationFrame(frame);
  }

  // The state right after step i finished (a completed 'unfold' entry is
  // really its paired fold step run in reverse to p=0, i.e. back to that
  // fold's own starting ref).
  function stateAfterStep(i){
    const step = STEPS[i];
    return step.type==='unfold' ? frameForStep(STEPS[i-1], 0) : frameForStep(step, 1);
  }
  // The state a viewer should see when landing on step n — i.e. right
  // before n runs, equivalent to having just finished step n-1.
  function stateBeforeStep(n){
    return n<=0 ? FLAT : stateAfterStep(n-1);
  }

  // aria-disabled (not the native disabled attribute) so these buttons stay
  // focusable while "off" — a keyboard user tabbed onto Fold/Play doesn't
  // get bumped out when an animation starts, since disabled elements can't
  // hold focus but aria-disabled ones can. pointer-events:none in CSS blocks
  // mouse clicks; isDisabled()/the click-handler guards below block the
  // click that keyboard Enter/Space still fires on a focused button.
  function setButtonDisabled(btn, off){ btn.setAttribute('aria-disabled', off ? 'true' : 'false'); }
  function isDisabled(btn){ return btn.getAttribute('aria-disabled')==='true'; }
  function setButtons(on){ setButtonDisabled(el.foldBtn, !on); setButtonDisabled(el.playBtn, !on); }

  function updatePanel(){
    const total = STEPS.length;
    if(stepIndex>=total){
      el.stepCount.textContent='Complete';
      el.badge.textContent='Done'; el.badge.className='badge done';
      el.instruction.textContent='All 4 corners meet at one point above center, with center dipped down as the opposite tip, and the 4 edge midpoints spread apart forming the base\'s rim — the waterbomb base.';
      el.foldBtn.textContent='Replay'; setButtonDisabled(el.foldBtn, false);
      el.stageCaption.textContent='waterbomb base — collapsed';
    } else {
      const step = STEPS[stepIndex];
      el.stepCount.textContent = `Step ${stepIndex+1} of ${total}`;
      el.instruction.textContent = step.instruction;
      el.foldBtn.textContent = step.type==='unfold' ? 'Unfold →' : step.type==='collapse' ? 'Collapse →' : step.type==='flip' ? 'Flip →' : 'Fold →';
      setButtonDisabled(el.foldBtn, false);
      if(step.type==='collapse'){
        el.badge.textContent='3D collapse'; el.badge.className='badge collapse';
        el.stageCaption.textContent='one coordinated move, interpolated to the solved end pose';
      } else if(step.type==='unfold'){
        el.badge.textContent='Unfold'; el.badge.className='badge done';
        el.stageCaption.textContent='reversing the previous crease';
      } else if(step.type==='flip'){
        el.badge.textContent='Flip'; el.badge.className='badge done';
        el.stageCaption.textContent='rigid 180° turn about the vertical crease';
      } else {
        el.badge.textContent='Fold'; el.badge.className='badge valley';
        el.stageCaption.textContent='hinge rotation about the crease line, through center';
      }
    }
    el.stepsNav.innerHTML = STEPS.map((s,i)=>{
      const state = i<stepIndex ? ' done' : i===stepIndex ? ' current' : '';
      return `<button type="button" class="step-chip${state}" data-step="${i}" aria-label="Jump to step ${i+1}: ${s.label}">${s.label}</button>`;
    }).join('');
  }

  function advance(){
    return new Promise(resolve=>{
      if(animating || stepIndex>=STEPS.length){ resolve(); return; }
      animating = true; setButtons(false);
      const step = STEPS[stepIndex];
      const isUnfold = step.type==='unfold';
      const foldStep = isUnfold ? STEPS[stepIndex-1] : step;
      animateStep(foldStep, isUnfold, ()=>{
        stepIndex++; animating=false; setButtons(true); updatePanel(); resolve();
      });
    });
  }

  function reset(){
    stepIndex = 0; animating = false;
    applyFrame(FLAT);
    updatePanel();
  }

  // Jump straight to any step — to look ahead, go back, or rerun a step
  // already seen — without replaying everything before it. Lands on the
  // state right before that step runs; press Fold/Unfold/Flip/Collapse to
  // play it from there, same as reaching it normally would.
  function jumpToStep(n){
    if(animating) return;
    n = Math.max(0, Math.min(n, STEPS.length));
    playing = false; el.playBtn.textContent = '▶ Play all';
    stepIndex = n;
    applyFrame(stateBeforeStep(n));
    updatePanel();
  }
  el.stepsNav.addEventListener('click', (e)=>{
    const btn = e.target.closest('.step-chip');
    if(!btn) return;
    jumpToStep(parseInt(btn.dataset.step, 10));
  });

  el.foldBtn.addEventListener('click', ()=>{
    if(isDisabled(el.foldBtn)) return;
    if(stepIndex>=STEPS.length){ reset(); return; }
    advance();
  });
  el.playBtn.addEventListener('click', async ()=>{
    if(isDisabled(el.playBtn)) return;
    if(playing){ playing=false; el.playBtn.textContent='▶ Play all'; return; }
    if(stepIndex>=STEPS.length){ reset(); await new Promise(r=>setTimeout(r,200)); }
    // "Pause" (not "Stop"): clicking it again mid-sequence just halts the
    // autoplay loop after the in-flight step finishes — it doesn't reset
    // progress — so the label shouldn't imply the fold undoes itself.
    playing = true; el.playBtn.textContent='❚❚ Pause';
    while(playing && stepIndex<STEPS.length){
      await advance();
      if(!playing) break;
      await new Promise(r=>setTimeout(r, reducedMotion?50:450));
    }
    playing=false; el.playBtn.textContent='▶ Play all';
  });

  updatePanel();
})();
</script>
</body>
</html>
