<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fold Along — Waterbomb Base</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --bg:#EAE7DD;
  --surface:#FFFFFF;
  --surface-2:#F2EFE6;
  --ink:#20242A;
  --ink-muted:#5B6169;
  --border:#D7D2C4;
  --mat:#DAD5C7;
  --accent-valley:#C1442D;
  --accent-valley-soft:#F4DED7;
  --accent-mountain:#2B6E77;
  --accent-mountain-soft:#DCE9E8;
  --paper-front:#C1442D;
  --paper-back:#F2EEE3;
  --shadow: rgba(32,28,22,.20);
  --focus:#2B6E77;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1D22; --surface:#23262D; --surface-2:#2A2D35;
    --ink:#ECE9E2; --ink-muted:#9CA3AC; --border:#3A3E47; --mat:#2A2D34;
    --accent-valley-soft:#3B2622; --accent-mountain-soft:#1D3033;
    --shadow: rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#1A1D22; --surface:#23262D; --surface-2:#2A2D35;
  --ink:#ECE9E2; --ink-muted:#9CA3AC; --border:#3A3E47; --mat:#2A2D34;
  --accent-valley-soft:#3B2622; --accent-mountain-soft:#1D3033;
  --shadow: rgba(0,0,0,.55);
}

*{box-sizing:border-box;}
body{ margin:0; background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans', system-ui, sans-serif; -webkit-font-smoothing:antialiased; }

.site-bar{ border-bottom:1px solid var(--border); }
.site-bar-inner{ max-width:1080px; margin:0 auto; padding:1.1rem 1.5rem; display:flex; align-items:baseline; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
.site-title{ font-family:'Unbounded', sans-serif; font-weight:700; font-size:1rem; color:var(--ink); text-decoration:none; }
.site-tagline{ font-family:'IBM Plex Mono', monospace; font-size:.72rem; letter-spacing:.06em; color:var(--ink-muted); }
.site-nav{ display:flex; gap:1.1rem; }
.site-nav a{ font-family:'IBM Plex Mono', monospace; font-size:.78rem; letter-spacing:.04em; color:var(--ink-muted); text-decoration:none; }
.site-nav a:hover{ color:var(--ink); }
.site-nav a.current{ color:var(--accent-mountain); }

.wrap{ max-width:1080px; margin:0 auto; padding:2.5rem 1.5rem 4rem; }
header{ margin-bottom:2rem; }
h1{ font-family:'Unbounded', sans-serif; font-weight:700; font-size:clamp(1.7rem, 3.4vw, 2.35rem); line-height:1.12; margin:0; text-wrap:balance; }

.board{ display:grid; grid-template-columns: minmax(320px, 480px) 1fr; gap:1.75rem; align-items:start; }
@media (max-width: 780px){ .board{ grid-template-columns: 1fr; } }

.stage-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:1.25rem; box-shadow: 0 1px 2px var(--shadow); }
.stage-outer{ position:relative; aspect-ratio:1/1; border-radius:8px; background:var(--mat); overflow:hidden; cursor:grab; touch-action:none; }
.stage-outer.grabbing{ cursor:grabbing; }
.stage-outer canvas{ display:block; width:100%; height:100%; }
.stage-caption{ margin-top:.85rem; font-family:'IBM Plex Mono', monospace; font-size:.74rem; color:var(--ink-muted); text-align:center; }

.panel{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:1.5rem 1.6rem 1.7rem; box-shadow: 0 1px 2px var(--shadow); }
.panel-top{ display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1.1rem; }
.step-count{ font-family:'IBM Plex Mono', monospace; font-size:.78rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-muted); }
.badge{ font-family:'IBM Plex Mono', monospace; font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; padding:.3rem .6rem; border-radius:99px; white-space:nowrap; }
.badge.valley{ background:var(--accent-valley-soft); color:var(--accent-valley); }
.badge.collapse{ background:var(--accent-mountain-soft); color:var(--accent-mountain); }
.badge.done{ background:var(--surface-2); color:var(--ink-muted); }

.instruction{ font-family:'Unbounded', sans-serif; font-weight:600; font-size:1.22rem; line-height:1.35; margin:0 0 1.3rem; text-wrap:balance; min-height:3.6rem; }

.controls{ display:flex; gap:.6rem; margin-bottom:1.1rem; flex-wrap:wrap; }
button{ font-family:'IBM Plex Sans', sans-serif; font-size:.88rem; font-weight:500; padding:.85rem 1.05rem; min-height:44px; border-radius:9px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink); cursor:pointer; touch-action:manipulation; transition: background .15s ease, transform .1s ease, opacity .15s ease; }
button:hover:not(:disabled){ background:var(--border); }
button:active:not(:disabled){ transform: scale(.97); }
button:disabled{ opacity:.4; cursor:default; }
button:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
button.primary{ background:var(--accent-mountain); border-color:var(--accent-mountain); color:#fff; }
button.primary:hover:not(:disabled){ background:#255e66; }

.dots{ display:flex; gap:.4rem; }
.dot{ width:.5rem; height:.5rem; border-radius:99px; background:var(--border); }
.dot.filled{ background:var(--accent-mountain); }

.swatch-label{ font-family:'IBM Plex Mono', monospace; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-muted); margin:1.3rem 0 .7rem; }
.swatches{ display:flex; gap:.55rem; flex-wrap:wrap; }
.swatch{ width:28px; height:28px; padding:0; border-radius:50%; border:2px solid transparent; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12); cursor:pointer; }
.swatch:hover{ transform:scale(1.08); }
.swatch.active{ border-color:var(--ink); }
.swatch:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
</style>
</head>
<body>

<div class="site-bar">
  <div class="site-bar-inner">
    <span class="site-title">Fold Along</span>
    <nav class="site-nav">
      <a href="index.html" class="current">Waterbomb base</a>
      <a href="crane.html">Crane</a>
    </nav>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<div class="wrap">
  <header>
    <h1>Waterbomb base</h1>
  </header>

  <section>
    <div class="board">
      <div class="stage-card">
        <div class="stage-outer" id="stage"></div>
        <p class="stage-caption" id="stageCaption">square sheet, flat</p>
      </div>
      <div class="panel">
        <div class="panel-top">
          <span class="step-count" id="stepCount">Step 1 of 9</span>
          <span class="badge valley" id="badge">Fold</span>
        </div>
        <p class="instruction" id="instruction"></p>
        <div class="controls">
          <button id="foldBtn" class="primary">Fold →</button>
          <button id="playBtn">▶ Play all</button>
        </div>
        <div class="dots" id="dots"></div>
        <p class="swatch-label">Paper color</p>
        <div class="swatches" id="swatches"></div>
      </div>
    </div>
  </section>
</div>

<script>
(function(){
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- Geometry: 9 named points (center + 4 corners + 4 edge-midpoints) ----
  const OUTER = ['A','N','B','E','C','S','D','W'];

  // Flat starting positions (Y=0 plane). X,Z mirror the original 2D square (0-100),
  // recentered so the middle (Ctr) sits at the origin.
  const FLAT = {
    Ctr: new THREE.Vector3(0,0,0),
    A: new THREE.Vector3(-50,0,-50),
    B: new THREE.Vector3(50,0,-50),
    C: new THREE.Vector3(50,0,50),
    D: new THREE.Vector3(-50,0,50),
    N: new THREE.Vector3(0,0,-50),
    E: new THREE.Vector3(50,0,0),
    S: new THREE.Vector3(0,0,50),
    W: new THREE.Vector3(-50,0,0),
  };

  // 8 triangular faces, Ctr + consecutive outer points around the ring.
  // Non-indexed (each triangle gets its own 3 vertex slots, none shared) so
  // each panel can carry its own front/back color without fighting its
  // neighbors over a shared vertex.
  const PANELS = [];
  for(let i=0;i<OUTER.length;i++){
    PANELS.push(['Ctr', OUTER[(i+1)%OUTER.length], OUTER[i]]);
  }
  const RED = [0.757,0.267,0.176], WHITE = [0.949,0.933,0.890];

  // Ring edges for the outline overlay: 8 spokes (Ctr-outer) + 8 rim segments.
  const LINE_PAIRS = [];
  OUTER.forEach(n=>LINE_PAIRS.push('Ctr',n));
  for(let i=0;i<OUTER.length;i++) LINE_PAIRS.push(OUTER[i], OUTER[(i+1)%OUTER.length]);

  function rotateAroundAxisAtOrigin(v, axisDir, angleRad){
    const axis = axisDir.clone().normalize();
    const cosA = Math.cos(angleRad), sinA = Math.sin(angleRad);
    const term1 = v.clone().multiplyScalar(cosA);
    const term2 = new THREE.Vector3().crossVectors(axis, v).multiplyScalar(sinA);
    const term3 = axis.clone().multiplyScalar(axis.dot(v) * (1 - cosA));
    return term1.add(term2).add(term3);
  }

  // Cache a consistently-signed rotation axis per fold step, so every flap
  // swings toward +Y (up, over the rest of the sheet) regardless of which
  // order the two crease points happen to be listed in. Only used for the
  // precrease folds, whose crease endpoints are always at FLAT position
  // (they're diameters through the center) so reading from FLAT is safe.
  function axisForStep(step){
    if(step._axis) return step._axis;
    const a = FLAT[step.crease[0]], b = FLAT[step.crease[1]];
    const axisDir = new THREE.Vector3().subVectors(b, a);
    const probe = rotateAroundAxisAtOrigin(FLAT[step.moving[0]], axisDir, 0.05);
    if(probe.y < FLAT[step.moving[0]].y){ axisDir.negate(); }
    step._axis = axisDir;
    return axisDir;
  }

  // The real collapse can't be built from a chain of ordinary single-hinge
  // folds — that was tried and it's mathematically wrong: any sequence of
  // whole-flap 180° hinge folds along these creases drags the 4 edge
  // midpoints (N,E,S,W) together into a single point too, when the real
  // base needs them to stay apart, spread around the rim. The actual
  // mechanism is a single coordinated motion (the vertical/horizontal
  // creases and the diagonals moving in opposite senses at once), so it's
  // modeled here as one target 3D pose, derived from the one constraint
  // that has to hold throughout: every panel is a rigid triangle, so the
  // three original side lengths (center-to-corner, center-to-edge-midpoint,
  // and each rim edge) must still measure the same once collapsed.
  // Solving that (center pops up by h, the 4 corners converge to one point
  // h below center, and by the square's symmetry N/E/S/W stay at a shared
  // height and radius) gives a clean, fully consistent answer:
  // h = radius = 25*sqrt(2), with N/E/S/W staying in the original z=0
  // plane, just pulled in from radius 50 to 25*sqrt(2).
  const K = 25 * Math.SQRT2;
  const CORNER_PT = new THREE.Vector3(0, -K, 0);
  const COLLAPSED = {
    Ctr: new THREE.Vector3(0, K, 0),
    A: CORNER_PT, B: CORNER_PT, C: CORNER_PT, D: CORNER_PT,
    N: new THREE.Vector3(0, 0, -K),
    E: new THREE.Vector3(K, 0, 0),
    S: new THREE.Vector3(0, 0, K),
    W: new THREE.Vector3(-K, 0, 0),
  };

  // ---- Steps ----
  const STEPS = [
    { type:'fold', crease:['W','E'], moving:['N','A','B'], instruction:'Fold the top down to the bottom, creating a horizontal center crease.' },
    { type:'unfold', instruction:'Unfold.' },
    { type:'fold', crease:['N','S'], moving:['E','B','C'], instruction:'Fold the right side to the left side, creating a vertical center crease.' },
    { type:'unfold', instruction:'Unfold.' },
    { type:'fold', crease:['A','C'], moving:['B','N','E'], instruction:'Fold the top-right corner to the bottom-left corner, creating a diagonal crease.' },
    { type:'unfold', instruction:'Unfold.' },
    { type:'fold', crease:['B','D'], moving:['A','N','W'], instruction:'Fold the top-left corner to the bottom-right corner, creating the other diagonal crease.' },
    { type:'unfold', instruction:'Unfold. All 4 creases exist now — this is the hard part next.' },
    { type:'collapse', instruction:'Now fold on the vertical and horizontal creases while the diagonals push through the other way — the whole sheet collapses at once. All 4 corners meet at one point below center; center pops up as the opposite tip; the 4 edge midpoints stay apart, forming the base\'s rim.' },
  ];

  // ---- Three.js scene ----
  const stageEl = document.getElementById('stage');
  const scene = new THREE.Scene();
  // Near/far kept tight around where the geometry actually lives (roughly
  // 50-450 units from camera) — the depth buffer only has so much
  // precision, and wasting most of it on 0.1-1000 was the cause of visible
  // z-fighting flicker while two panels pass through nearly-coplanar
  // poses mid-fold.
  const camera = new THREE.PerspectiveCamera(38, 1, 50, 500);
  camera.position.set(150, 70, 180);
  camera.lookAt(0, -35, 0);

  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  stageEl.appendChild(renderer.domElement);

  const group = new THREE.Group();
  scene.add(group);

  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const dir1 = new THREE.DirectionalLight(0xffffff, 0.7); dir1.position.set(100,150,100); scene.add(dir1);
  const dir2 = new THREE.DirectionalLight(0xffffff, 0.35); dir2.position.set(-100,-50,-100); scene.add(dir2);

  // Non-indexed: 8 panels x 3 vertices, none shared — lets each triangle
  // keep its own normal (and its own color) under flatShading instead of
  // averaging with neighbors at the shared Ctr vertex.
  const geometry = new THREE.BufferGeometry();
  const vertCount = PANELS.length * 3;
  const positions = new Float32Array(vertCount * 3);
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

  // The paper has a real front and a real back, always — a viewer should
  // be able to spin the flat, untouched sheet and see the front color on
  // top, white underneath, before a single fold happens. That can only
  // come from the GPU's own per-fragment "which side of this triangle am I
  // looking at" test (gl_FrontFacing): vertex colors are the same
  // regardless of which side is toward the camera, so they can't represent
  // a true two-sided sheet. Panels are wound so the front (+Y when flat)
  // is consistent everywhere, and a fold is a rotation (never a
  // reflection), so that winding — and therefore which side is "front" —
  // never changes; this just asks, per pixel, which side is currently
  // facing the camera.
  //
  // The front color is a uniform (not baked into the shader source) so the
  // color swatches can change it live, without recompiling.
  const colorUniforms = { uFront: { value: new THREE.Color(...RED) }, uBack: { value: new THREE.Color(...WHITE) } };
  const paperMat = new THREE.MeshStandardMaterial({
    side: THREE.DoubleSide, roughness:0.85, metalness:0.05, flatShading:true
  });
  paperMat.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, colorUniforms);
    shader.fragmentShader = 'uniform vec3 uFront;\nuniform vec3 uBack;\n' + shader.fragmentShader.replace(
      '#include <color_fragment>',
      `#include <color_fragment>
      diffuseColor.rgb = gl_FrontFacing ? uFront : uBack;`
    );
  };
  const paperMesh = new THREE.Mesh(geometry, paperMat);
  group.add(paperMesh);

  const linePositions = new Float32Array(LINE_PAIRS.length * 3);
  const lineGeo = new THREE.BufferGeometry();
  lineGeo.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
  const lineMat = new THREE.LineBasicMaterial({ color: 0x20242A, transparent:true, opacity:0.4 });
  const lines = new THREE.LineSegments(lineGeo, lineMat);
  group.add(lines);

  function applyFrame(frame){
    let vi = 0;
    PANELS.forEach(tri=>{
      tri.forEach(name=>{
        const p = frame[name] || FLAT[name];
        positions[vi*3]=p.x; positions[vi*3+1]=p.y; positions[vi*3+2]=p.z;
        vi++;
      });
    });
    geometry.attributes.position.needsUpdate = true;
    geometry.computeVertexNormals();

    LINE_PAIRS.forEach((name,i)=>{
      const p = frame[name] || FLAT[name];
      linePositions[i*3]=p.x; linePositions[i*3+1]=p.y; linePositions[i*3+2]=p.z;
    });
    lineGeo.attributes.position.needsUpdate = true;
  }

  applyFrame(FLAT);

  function resize(){
    const w = stageEl.clientWidth, h = stageEl.clientHeight;
    if(!w || !h) return;
    renderer.setSize(w, h, false);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stageEl);
  resize();

  // Gentle auto-rotate until the user first drags, then it's fully in
  // their hands — dragging (mouse or touch, via Pointer Events so both
  // are handled the same way) spins the model around Y and tilts it
  // around X. Free, unclamped tilt on purpose: the paper has a real front
  // and back, and the only way to see the back is to actually turn it
  // over — an artificial limit here would make that impossible.
  let autoRotate = 0, userRotating = false, dragging = false, lastX = 0, lastY = 0;

  stageEl.addEventListener('pointerdown', (e)=>{
    dragging = true;
    userRotating = true;
    lastX = e.clientX; lastY = e.clientY;
    stageEl.setPointerCapture(e.pointerId);
    stageEl.classList.add('grabbing');
  });
  stageEl.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    group.rotation.y += dx * 0.008;
    group.rotation.x += dy * 0.008;
  });
  function endDrag(){ dragging = false; stageEl.classList.remove('grabbing'); }
  stageEl.addEventListener('pointerup', endDrag);
  stageEl.addEventListener('pointercancel', endDrag);
  stageEl.addEventListener('pointerleave', endDrag);

  function renderLoop(){
    if(!userRotating){
      autoRotate += 0.003;
      group.rotation.y = Math.sin(autoRotate) * 0.35;
    }
    renderer.render(scene, camera);
    requestAnimationFrame(renderLoop);
  }
  renderLoop();

  // ---- Paper color ----
  // Front color only — the back stays a consistent off-white, matching
  // how real single-color origami paper actually works. Remembered across
  // visits (and shared with the other page) via localStorage; falls back
  // silently to the default if storage isn't available.
  const PAPER_COLORS = [
    { name:'Red',    hex:'#C1442D' },
    { name:'Orange', hex:'#D97A34' },
    { name:'Yellow', hex:'#D9B23C' },
    { name:'Green',  hex:'#4C8C6B' },
    { name:'Blue',   hex:'#3B6FA0' },
    { name:'Purple', hex:'#7A5A9E' },
    { name:'Pink',   hex:'#C97B94' },
    { name:'Black',  hex:'#2B2E33' },
  ];
  const swatchesEl = document.getElementById('swatches');
  function setPaperColor(hex, save){
    colorUniforms.uFront.value.set(hex);
    swatchesEl.querySelectorAll('.swatch').forEach(b=>{
      b.classList.toggle('active', b.dataset.hex.toLowerCase()===hex.toLowerCase());
    });
    if(save){
      try{ localStorage.setItem('foldalong-paper-color', hex); }catch(e){}
    }
  }
  swatchesEl.innerHTML = PAPER_COLORS.map(c=>
    `<button class="swatch" style="background:${c.hex}" data-hex="${c.hex}" aria-label="${c.name}" title="${c.name}"></button>`
  ).join('');
  swatchesEl.querySelectorAll('.swatch').forEach(btn=>{
    btn.addEventListener('click', ()=> setPaperColor(btn.dataset.hex, true));
  });
  let savedColor = null;
  try{ savedColor = localStorage.getItem('foldalong-paper-color'); }catch(e){}
  setPaperColor(savedColor || PAPER_COLORS[0].hex, false);

  // ---- Playback state ----
  let stepIndex = 0, animating = false, playing = false;

  const el = {
    stepCount: document.getElementById('stepCount'),
    badge: document.getElementById('badge'),
    instruction: document.getElementById('instruction'),
    foldBtn: document.getElementById('foldBtn'),
    playBtn: document.getElementById('playBtn'),
    dots: document.getElementById('dots'),
    stageCaption: document.getElementById('stageCaption'),
  };

  function easeInOut(t){ return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }

  function animateStep(step, reverse, onDone){
    const isCollapse = step.type==='collapse';
    const duration = reducedMotion ? 1 : (isCollapse ? 1800 : 900);
    const start = performance.now();
    const axisDir = isCollapse ? null : axisForStep(step);

    function computeFrame(p){
      if(isCollapse){
        // Stop just short of p=1. At the exact mathematical endpoint every
        // panel sits exactly perpendicular to its own flat orientation —
        // a genuine tie with no well-defined "outward" side, which is why
        // the finished base was showing an arbitrary red/white patchwork
        // instead of solid red. The last fraction of a percent of motion
        // is visually imperceptible, so stopping short of the tie keeps
        // every panel decisively on the same side it's been on the whole
        // animation — the paper's back stays tucked inside, as it does on
        // a real folded base.
        const pc = Math.min(p, 0.985);
        const out = {};
        ['Ctr', ...OUTER].forEach(name=>{
          out[name] = new THREE.Vector3().lerpVectors(FLAT[name], COLLAPSED[name], pc);
        });
        return out;
      }
      const angleRad = p * Math.PI;
      // A folded flap ends up exactly coplanar with the static half
      // underneath it (folding a rectangle in half always lands one half
      // exactly on the other) — without help, the GPU's depth test resolves
      // that dead tie arbitrarily, which is why some folds correctly showed
      // the folded-over (white) side on top and others silently didn't. The
      // flap is the one that should render on top (that's what "folded
      // over" means), so lift it a hair as it approaches fully folded —
      // zero at the flat start, where there's no overlap yet to resolve.
      const lift = (angleRad / Math.PI) * 0.3;
      const out = { Ctr: FLAT.Ctr.clone() };
      OUTER.forEach(name=>{
        out[name] = step.moving.includes(name)
          ? rotateAroundAxisAtOrigin(FLAT[name], axisDir, angleRad).add(new THREE.Vector3(0, lift, 0))
          : FLAT[name].clone();
      });
      return out;
    }

    function frame(now){
      let t = Math.min(1, (now-start)/duration);
      const te = easeInOut(t);
      const p = reverse ? (1-te) : te;
      applyFrame(computeFrame(p));
      if(t<1){ requestAnimationFrame(frame); return; }
      onDone();
    }
    requestAnimationFrame(frame);
  }

  function setButtons(on){ el.foldBtn.disabled=!on; el.playBtn.disabled=!on; }

  function updatePanel(){
    const total = STEPS.length;
    if(stepIndex>=total){
      el.stepCount.textContent='Complete';
      el.badge.textContent='Done'; el.badge.className='badge done';
      el.instruction.textContent='All 4 corners meet at one point below center, with center popped up as the opposite tip, and the 4 edge midpoints spread apart forming the base\'s rim — the waterbomb base.';
      el.foldBtn.textContent='Replay'; el.foldBtn.disabled=false;
      el.stageCaption.textContent='waterbomb base — collapsed';
    } else {
      const step = STEPS[stepIndex];
      el.stepCount.textContent = `Step ${stepIndex+1} of ${total}`;
      el.instruction.textContent = step.instruction;
      el.foldBtn.textContent = step.type==='unfold' ? 'Unfold →' : (step.type==='collapse' ? 'Collapse →' : 'Fold →');
      el.foldBtn.disabled = false;
      if(step.type==='collapse'){
        el.badge.textContent='3D collapse'; el.badge.className='badge collapse';
        el.stageCaption.textContent='one coordinated move, interpolated to the solved end pose';
      } else if(step.type==='unfold'){
        el.badge.textContent='Unfold'; el.badge.className='badge done';
        el.stageCaption.textContent='reversing the previous crease';
      } else {
        el.badge.textContent='Fold'; el.badge.className='badge valley';
        el.stageCaption.textContent='hinge rotation about the crease line, through center';
      }
    }
    el.dots.innerHTML = STEPS.map((_,i)=>`<span class="dot${i<stepIndex?' filled':''}"></span>`).join('');
  }

  function advance(){
    return new Promise(resolve=>{
      if(animating || stepIndex>=STEPS.length){ resolve(); return; }
      animating = true; setButtons(false);
      const step = STEPS[stepIndex];
      const isUnfold = step.type==='unfold';
      const foldStep = isUnfold ? STEPS[stepIndex-1] : step;
      animateStep(foldStep, isUnfold, ()=>{
        stepIndex++; animating=false; setButtons(true); updatePanel(); resolve();
      });
    });
  }

  function reset(){
    stepIndex = 0; animating = false;
    applyFrame(FLAT);
    updatePanel();
  }

  el.foldBtn.addEventListener('click', ()=>{
    if(stepIndex>=STEPS.length){ reset(); return; }
    advance();
  });
  el.playBtn.addEventListener('click', async ()=>{
    if(playing){ playing=false; el.playBtn.textContent='▶ Play all'; return; }
    if(stepIndex>=STEPS.length){ reset(); await new Promise(r=>setTimeout(r,200)); }
    playing = true; el.playBtn.textContent='■ Stop';
    while(playing && stepIndex<STEPS.length){
      await advance();
      if(!playing) break;
      await new Promise(r=>setTimeout(r, reducedMotion?50:450));
    }
    playing=false; el.playBtn.textContent='▶ Play all';
  });

  updatePanel();
})();
</script>
</body>
</html>
